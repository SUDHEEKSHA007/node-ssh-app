name: Node CI + Docker

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run App (Basic Test)
        run: node app.js &

      - name: Build Docker Image
        run: docker build -t node-ssh-app .

      - name: Run Docker Container
        run: docker run -d -p 3000:3000 node-ssh-app
